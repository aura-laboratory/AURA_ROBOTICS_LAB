# ================================================================
# AURA LAB 1 - virtual configuration
# Path Planning • Task Allocation • Routing
# ================================================================
#
# IMPORTANT:
#   Do not edit path_planner.method to switch between Lab 1 modes.
#   Use one of:
#     ./run_lab1_rrt.sh
#     ./run_lab1_astar.sh
#     ./run_lab1_student.sh
#
# Lab 1 pipeline:
#   1) shared/purple viewpoint assignment
#   2) TSP visit ordering
#   3) local path planning
#   4) heading interpolation
#   5) trajectory generation and smoothing
#   6) temporal two-UAV collision avoidance
#
# Question A:
#   Compare the provided backend A* and RRT planners.
#
# Question B:
#   Implement the shared-viewpoint assignment strategy.
#
# Question C:
#   Implement the student local path planner.
#
# TSP ordering, heading interpolation, trajectory generation/smoothing
# and temporal collision avoidance are provided parts of the pipeline.
# ================================================================


problem:
  name: apocalypse_small.problem
  plot: false


simulation:
  flight_always_allowed: true


solution_time_constraint:
  soft: 120.0
  hard: 240.0


mission:
  timeout: 200.0


global_frame: fixed_origin
print_info: false


uav_names:
  - uav1
  - uav2


cameras:
  red:
    fov_length: 4.5
    angle_of_view:
      horizontal: 1.4
      vertical: 1.4

  blue:
    fov_length: 4.5
    angle_of_view:
      horizontal: 1.4
      vertical: 1.4


viewpoints:
  distance: 4.0

  inspection_limits:
    distance: 0.3
    heading: 0.2
    pitch: 0.2


# ================================================================
# UAV DYNAMIC CONSTRAINTS
#
# These limits are used during trajectory generation and sampling.
# They are part of the provided Lab pipeline.
# ================================================================
dynamic_constraints:
  controller: fast
  tolerance: 0.01

  max_velocity:
    x: 5.0
    y: 5.0
    z: 2.0

  max_acceleration:
    x: 5.0
    y: 5.0
    z: 2.0

  max_heading_rate: 1.0
  max_heading_rate_acceleration: 2.0


# ================================================================
# TRAJECTORY PARAMETERS
# ================================================================
trajectories:
  dt: 0.2
  subscribe: true

  min_distance:
    obstacles: 1.9
    mutual: 2.5

  check:
    obstacles: 1.5
    mutual: 2.5


trajectory_sampling:
  with_stops: true


# ================================================================
# PROVIDED: PATH SMOOTHING
#
# Applied after geometric path planning when the final trajectory
# is generated.
# Do not modify for the Lab assignment.
# ================================================================
path_smoothing:
  lookahead_dist: 1.0
  sampling_step: 0.4


# ================================================================
# PROVIDED: TSP VISIT ORDERING
#
# The TSP solver determines the order in which each UAV visits the
# viewpoints assigned to it.
#
# Euclidean distance estimation is used as the common ordering cost.
# In STUDENT mode, the planner integration explicitly keeps the TSP
# ordering separate from StudentPlanner.plan_path().
#
# The TSP solver is provided and should not be modified for the Lab.
# ================================================================
tsp:
  clustering: random
  distance_estimates: euclidean


# ================================================================
# PATH PLANNING
# ================================================================
path_planner:

  # This value is overwritten temporarily by run_lab1.sh.
  #
  # Do not modify it manually to switch modes.
  #
  # Question A:
  #   rrt
  #   astar
  #
  # Question C:
  #   student
  method: rrt

  timeout: 60.0
  straighten_paths: false


  # --------------------------------------------------------------
  # PROVIDED A* PARAMETERS
  # Used by ./run_lab1_astar.sh in Question A.
  # --------------------------------------------------------------
  astar:
    grid_resolution: 0.3


  # --------------------------------------------------------------
  # PROVIDED BACKEND RRT PARAMETERS
  # Used by ./run_lab1_rrt.sh in Question A.
  # --------------------------------------------------------------
  rrt:
    branch_size: 3.0

    sampling:
      method: uniform

      gaussian:
        stddev_inflation: 0.2

    star:
      neighborhood: 1.0


  # --------------------------------------------------------------
  # REFERENCE STUDENT RRT PARAMETERS
  #
  # These parameters are used by the provided reference Student RRT.
  #
  # The reference planner allows Question B to be tested before the
  # custom local path planner required in Question C is implemented.
  # --------------------------------------------------------------
  student:
    step_size: 3.0
    goal_bias: 0.20
    max_iterations: 4000
    collision_check_step: 0.25


# ================================================================
# PROVIDED: TEMPORAL TWO-UAV COLLISION AVOIDANCE
#
# StudentPlanner.resolve_start_delay() checks the generated
# trajectories for UAV-UAV conflicts.
#
# If required, one UAV is delayed at its start until the temporal
# conflict disappears.
#
# This stage is handled explicitly by the AURA Lab 1 planner and
# should not be modified for the Lab assignment.
# ================================================================
collision_avoidance:
  method: none


# ================================================================
# VISUALIZATION
# ================================================================
visualization:

  python:
    dynamics: false
    mutual_distance: false
    obstacle_distance: false
    trajectories: false

  rviz:
    use: true
    horizon_length: 20
    playback_speed: 3.0